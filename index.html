<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puzzle Fighter Arena</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header class="hero">
      <p class="eyebrow">Arcade Duel</p>
      <h1>Puzzle Fighter Arena</h1>
      <p>Swap adjacent gems to make 3+ matches, build combos, and knock out your rival.</p>
    </header>

    <section class="hud">
      <article class="fighter player">
        <h2>You</h2>
        <div class="bar"><span id="playerHpBar"></span></div>
        <p><strong id="playerHp">100</strong> HP</p>
      </article>

      <article class="fighter enemy">
        <h2>Rival</h2>
        <div class="bar"><span id="enemyHpBar"></span></div>
        <p><strong id="enemyHp">100</strong> HP</p>
      </article>
    </section>

    <section class="board-panel">
      <div id="board" class="board" aria-label="Puzzle board"></div>
      <div class="controls">
        <p id="status" aria-live="polite">Make a move!</p>
        <p class="small">Damage: matches deal 8 × combo level. Rival counters after your turn.</p>
        <button id="restart" type="button">Restart Match</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
